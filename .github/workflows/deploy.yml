name: Deploy to Contabo VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time: a second push while a deploy is running waits.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Pull & rebuild on VPS
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: SSH deploy
        # host_key_checking is disabled so first-time deploys work without
        # pre-seeding known_hosts; the VPS is private and key-authenticated.
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          host_key_checking: false
          command_timeout: 50m
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            # Public repo: HTTPS clone/pull needs no credentials on the VPS.
            # Switch to git@github.com:gstorelli/worldmonitor.git (and register
            # a deploy key) if the repository ever becomes private.
            REPO_URL="https://github.com/gstorelli/worldmonitor.git"

            echo "==> identity"
            whoami

            echo "==> tooling check"
            docker --version || { echo "ERROR: docker missing on VPS"; exit 1; }
            if docker compose version >/dev/null 2>&1; then COMPOSE="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then COMPOSE="docker-compose"
            else echo "ERROR: neither 'docker compose' (v2) nor 'docker-compose' found"; exit 1; fi
            echo "using: ${COMPOSE}"

            echo "==> bootstrap checkout (first deploy clones)"
            if [ ! -d "${DEPLOY_PATH}/.git" ]; then
              mkdir -p "$(dirname "${DEPLOY_PATH}")"
              git clone "${REPO_URL}" "${DEPLOY_PATH}"
            fi
            cd "${DEPLOY_PATH}"
            git remote set-url origin "${REPO_URL}" || true

            echo "==> ensure external proxy network (idempotent)"
            docker network inspect nginx-proxy >/dev/null 2>&1 || docker network create nginx-proxy

            echo "==> git pull origin main"
            git fetch origin
            git pull --ff-only origin main

            echo "==> compose up -d --build"
            ${COMPOSE} up -d --build

            echo "==> prune dangling images"
            docker image prune -f

            echo "==> health gate (container internal 8080)"
            ok=0
            for i in $(seq 1 18); do
              if docker exec worldmonitor wget -qO- http://127.0.0.1:8080/api/version >/dev/null 2>&1 \
                 || docker exec worldmonitor node -e "fetch('http://127.0.0.1:8080/api/version').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" >/dev/null 2>&1; then
                echo "health OK (attempt ${i})"
                ok=1
                break
              fi
              echo "waiting for worldmonitor... (${i}/18)"
              sleep 10
            done
            if [ "${ok}" != "1" ]; then
              echo "ERROR: worldmonitor did not become healthy after deploy"
              ${COMPOSE} ps
              ${COMPOSE} logs --tail=50 worldmonitor || true
              exit 1
            fi

            echo "==> stack status"
            ${COMPOSE} ps
            echo "==> deploy complete: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      # End-to-end verification from the public internet: proxies the same
      # vantage point as a visitor, so it catches proxy-routing / certificate
      # issues the container health gate can't. -L follows any http->https
      # redirect, -k tolerates the interim acme-companion cert.
      - name: Verify production endpoint
        run: |
          ok=0
          for i in $(seq 1 30); do
            code=$(curl -sLk -o /dev/null -w '%{http_code}' --connect-timeout 15 --max-time 25 https://risksentinel.opencyber.org/api/version 2>/dev/null || true)
            echo "attempt ${i}: https://risksentinel.opencyber.org/api/version -> ${code}"
            if [ "${code}" = "200" ]; then ok=1; break; fi
            sleep 15
          done
          if [ "${ok}" != "1" ]; then
            echo "ERROR: production endpoint never returned 200 from the public internet"
            echo "--- http://risksentinel.opencyber.org/ ---"
            curl -sI --max-time 20 http://risksentinel.opencyber.org/ || true
            echo "--- https://risksentinel.opencyber.org/ ---"
            curl -sIk --max-time 20 https://risksentinel.opencyber.org/ | head -20
            exit 1
          fi
          echo "==> production endpoint OK: https://risksentinel.opencyber.org"