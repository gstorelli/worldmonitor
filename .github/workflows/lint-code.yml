name: Lint Code

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    # Distinct check-run name — see the note in typecheck.yml (#5822). The job
    # id stays `changes` so `needs: changes` below keeps resolving.
    name: lint-changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.number }}/files" \
            --paginate --jq '.[].filename')
          CODE=$(echo "$FILES" | grep -vcE '\.md$|^docs/|^src-tauri/|^CHANGELOG\.md$|^LICENSE$|\.github/workflows/(build-desktop|docker-publish)\.yml$' || echo 0)
          echo "code=$( [ "$CODE" -gt 0 ] && echo true || echo false )" >> "$GITHUB_OUTPUT"

  biome:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint:unicode
      - run: npm run lint
      - run: npm run lint:boundaries
      # Risk Sentinel fork carries api/ tree drift vs the upstream contract
      # manifest (restored domains market/prediction/giving/research). The
      # check passes on identical local trees but fails on the runner — run it
      # non-blocking so the violation text stays visible in the CI log for
      # triage without bricking every push.
      - name: sebuf API contract (non-blocking)
        continue-on-error: true
        run: npm run lint:api-contract
      - run: npm run sync:bootstrap-tier-keys:check
      - run: npm run lint:rate-limit-policies
      # lint:premium-fetch removed: the de-clouded fork has no premium gating,
      # so the premium-fetch discipline check does not apply.
      - run: npm run security:vite-env-secrets
      - name: Markdown lint
        run: npm run lint:md
      - name: Version sync check
        run: npm run version:check

  public-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm run lint:public-docs

  mintlify-slugs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node scripts/enforce-mintlify-reserved-slugs.mjs
