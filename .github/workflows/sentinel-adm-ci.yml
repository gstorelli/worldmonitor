name: SENTINEL-ADM CI

on:
  push:
    paths:
      - 'sentinel-adm/**'
      - '.github/workflows/sentinel-adm-ci.yml'
  pull_request:
    paths:
      - 'sentinel-adm/**'
      - '.github/workflows/sentinel-adm-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - test_privacy
          - test_legal
          - test_llm_adapter
          - test_sanctions
          - test_radar
          - test_evidence
          - test_config_dispatch
    defaults:
      run:
        working-directory: sentinel-adm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Byte-compile the package
        run: python -m compileall -q app

      - name: Run ${{ matrix.module }}
        run: |
          set -o pipefail
          python -m unittest tests.${{ matrix.module }} -v 2>&1 | tee /tmp/log-${{ matrix.module }}.txt

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.module }}
          path: /tmp/log-${{ matrix.module }}.txt
          if-no-files-found: ignore
          retention-days: 7

  diagnostics:
    name: Publish diagnostics
    needs: tests
    if: always() && needs.tests.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: logs-*
          merge-multiple: true
          path: /tmp/logs

      - name: Publish the combined log on the ci-diagnostics branch
        run: |
          set -e
          mkdir -p sentinel-adm/.ci
          {
            echo "# SENTINEL-ADM CI failure log"
            echo "# commit: ${GITHUB_SHA}"
            echo "# date:   $(date -u +%FT%TZ)"
            for file in /tmp/logs/*.txt; do
              echo
              echo "===== $(basename "$file") ====="
              tail -n 400 "$file"
            done
          } > sentinel-adm/.ci/last-failure.log
          git config user.name "sentinel-adm-ci"
          git config user.email "sentinel-adm-ci@users.noreply.github.com"
          git checkout -B ci-diagnostics
          git add -f sentinel-adm/.ci/last-failure.log
          git commit -m "ci(sentinel-adm): failure diagnostics for ${GITHUB_SHA:0:9}" || true
          git push -f origin ci-diagnostics
