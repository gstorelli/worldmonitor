# =============================================================================
# World Monitor — Docker / Podman Compose (nginx-proxy production layout)
# =============================================================================
# Self-contained stack: app + Redis + AIS relay.
#
# Quick start (dev, no proxy):
#   cp .env.example .env        # add your API keys
#   docker compose up -d --build
#
# Production (Contabo VPS behind jwilder/nginx-proxy + acme-companion):
#   - the `worldmonitor` container joins the EXTERNAL `nginx-proxy` network
#     and is routed via VIRTUAL_HOST / LETSENCRYPT_HOST
#   - NO host ports are exposed: all inbound traffic passes through the proxy
#   - Redis/relay stay on the isolated `internal-net` bridge
#   - one-time server setup:
#       docker network create nginx-proxy   # must exist before compose up
#       cp .env.example .env && $EDITOR .env
#   - to reach the app locally during debugging, run a throwaway mapping:
#       docker run --rm -p 8080:8080 --env-file .env --network <stack>_internal-net worldmonitor:latest
# =============================================================================

services:

  worldmonitor:
    build:
      context: .
      dockerfile: Dockerfile
    image: worldmonitor:latest
    container_name: worldmonitor
    networks:
      - nginx-proxy
      - internal-net
    environment:
      # ── jwilder/nginx-proxy routing (external network) ──
      VIRTUAL_HOST: risksentinel.opencyber.org
      LETSENCRYPT_HOST: risksentinel.opencyber.org
      LETSENCRYPT_EMAIL: info@opencyber.org
      # Internal port the container nginx listens on (Dockerfile EXPOSE 8080)
      VIRTUAL_PORT: "8080"
      # ── App configuration ──
      # Upstash-compatible Redis REST endpoint (local redis-rest service).
      # The token falls back to the local development default when
      # REDIS_TOKEN is not set in .env — production must override it.
      UPSTASH_REDIS_REST_URL: "http://redis-rest:80"
      UPSTASH_REDIS_REST_TOKEN: "${REDIS_TOKEN:-risk_sentinel_local_redis_secret}"
      LOCAL_API_PORT: "46123"
      LOCAL_API_MODE: "docker"
      LOCAL_API_CLOUD_FALLBACK: "false"
      WS_RELAY_URL: "http://ais-relay:3004"
      # LLM provider (any OpenAI-compatible endpoint)
      LLM_API_URL: "${LLM_API_URL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      # n8n ingestion auth (Risk Sentinel): required by POST /api/n8n/ingest
      # when set. Generate with: openssl rand -hex 32
      N8N_INGEST_SECRET: "${N8N_INGEST_SECRET:-}"
      # Data source API keys (optional — features degrade gracefully)
      AISSTREAM_API_KEY: "${AISSTREAM_API_KEY:-}"
      FINNHUB_API_KEY: "${FINNHUB_API_KEY:-}"
      EIA_API_KEY: "${EIA_API_KEY:-}"
      FRED_API_KEY: "${FRED_API_KEY:-}"
      ACLED_EMAIL: "${ACLED_EMAIL:-}"
      ACLED_PASSWORD: "${ACLED_PASSWORD:-}"
      ACLED_ACCESS_TOKEN: "${ACLED_ACCESS_TOKEN:-}"
      NASA_FIRMS_API_KEY: "${NASA_FIRMS_API_KEY:-}"
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN:-}"
      AVIATIONSTACK_API: "${AVIATIONSTACK_API:-}"
      TRAVELPAYOUTS_API_TOKEN: "${TRAVELPAYOUTS_API_TOKEN:-}"
    # Docker secrets (recommended for API keys — keeps them out of docker inspect).
    # Create secrets/ dir with one file per key, then uncomment below.
    # secrets:
    #   - GROQ_API_KEY
    #   - AISSTREAM_API_KEY
    #   - FINNHUB_API_KEY
    #   - FRED_API_KEY
    #   - NASA_FIRMS_API_KEY
    #   - LLM_API_KEY
    depends_on:
      redis-rest:
        condition: service_started
      ais-relay:
        condition: service_started
    restart: unless-stopped

  ais-relay:
    build:
      context: .
      dockerfile: Dockerfile.relay
    image: worldmonitor-ais-relay:latest
    container_name: worldmonitor-ais-relay
    networks:
      - internal-net
    environment:
      AISSTREAM_API_KEY: "${AISSTREAM_API_KEY:-}"
      FINNHUB_API_KEY: "${FINNHUB_API_KEY:-}"
      MARKET_YAHOO_REFRESH_INTERVAL_MS: "${MARKET_YAHOO_REFRESH_INTERVAL_MS:-900000}"
      UPSTASH_REDIS_REST_URL: "http://redis-rest:80"
      UPSTASH_REDIS_REST_TOKEN: "${REDIS_TOKEN:-risk_sentinel_local_redis_secret}"
      UPSTASH_ALLOW_INSECURE_HTTP: "true"
      UCDP_ACCESS_TOKEN: "${UCDP_ACCESS_TOKEN:-}"
      PORT: "3004"
    depends_on:
      redis-rest:
        condition: service_started
    restart: unless-stopped

  redis:
    image: docker.io/redis:7-alpine
    container_name: worldmonitor-redis
    networks:
      - internal-net
    # --requirepass closes off the network so any future sidecar / compromised
    # dependency added to the worldmonitor network can't read or write cache
    # entries without the password. Defense-in-depth alongside the REST token.
    # Falls back to the local development password when REDIS_PASSWORD is not
    # set in .env — production must override it.
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD:-risk_sentinel_local_redis_password}"
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    restart: unless-stopped

  redis-rest:
    build:
      context: docker
      dockerfile: Dockerfile.redis-rest
    image: worldmonitor-redis-rest:latest
    container_name: worldmonitor-redis-rest
    networks:
      - internal-net
    environment:
      SRH_TOKEN: "${REDIS_TOKEN:-risk_sentinel_local_redis_secret}"
      # Defense-in-depth: the redis service's --requirepass already locks the
      # backend, and the explicit password here keeps the connection string
      # consistent even if redis is later split out of this compose file.
      # Both values fall back to the local development defaults when unset in
      # .env — production must override them.
      SRH_CONNECTION_STRING: "redis://:${REDIS_PASSWORD:-risk_sentinel_local_redis_password}@redis:6379"
    depends_on:
      - redis
    restart: unless-stopped

# Docker secrets — uncomment and point to your secret files.
# Example: echo "gsk_abc123" > secrets/groq_api_key.txt
# secrets:
#   GROQ_API_KEY:
#     file: ./secrets/groq_api_key.txt
#   AISSTREAM_API_KEY:
#     file: ./secrets/aisstream_api_key.txt
#   FINNHUB_API_KEY:
#     file: ./secrets/finnhub_api_key.txt
#   FRED_API_KEY:
#     file: ./secrets/fred_api_key.txt
#   NASA_FIRMS_API_KEY:
#     file: ./secrets/nasa_firms_api_key.txt
#   LLM_API_KEY:
#     file: ./secrets/llm_api_key.txt

networks:
  # Created once on the host: docker network create nginx-proxy
  nginx-proxy:
    external: true
  # Isolated bridge for Redis + relay + redis-rest. The public-facing
  # worldmonitor container joins BOTH networks.
  internal-net:
    driver: bridge

volumes:
  redis-data: